<style>
:root{--bg:#07152b;--panel:#12233f;--panel2:#1a2b46;--line:#304463;--text:#f4f7ff;--muted:#aab5c8;--blue:#2d6cff;--cyan:#21d4fd;--green:#20c875;--yellow:#ffbd2e;--red:#ff5b6e;--purple:#8b5cf6;--shadow:0 12px 30px rgba(0,0,0,.25);--radius:22px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Segoe UI,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh;padding-bottom:82px}.topbar{position:sticky;top:0;z-index:30;background:rgba(7,21,43,.96);backdrop-filter:blur(14px);border-bottom:1px solid #243654;padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:15px;box-shadow:0 6px 18px rgba(0,0,0,.35)}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px}.icon-btn{width:42px;height:42px;border-radius:14px;background:#142742;border:1px solid var(--line);font-size:20px}.page{padding:18px;max-width:1100px;margin:auto}.hero{background:linear-gradient(135deg,#122c54,#0b1b34);border:1px solid #2e4e78;border-radius:28px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}.hero h2{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(145deg,#12243f,#0e1d35);border:1px solid #2e4565;border-radius:24px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.16)}.metric small{color:var(--muted);font-size:14px}.metric strong{display:block;font-size:28px;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.blue{color:#61a1ff}.muted{color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.section-title h3{margin:0;font-size:20px}.btn{padding:13px 16px;border-radius:15px;background:#1a3458;border:1px solid #35557e;font-weight:700}.btn.primary{background:linear-gradient(135deg,#2d7bf0,#2356df)}.btn.success{background:#126b4a}.btn.warn{background:#8d6209}.btn.danger{background:#7e2030}.btn.ghost{background:transparent}.btn.small{padding:9px 12px;font-size:13px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick .btn{min-height:58px;text-align:left}.searchbar{display:flex;gap:10px;margin-bottom:14px}.input{width:100%;background:#162842;border:1px solid #38516f;color:var(--text);border-radius:16px;padding:14px 15px;outline:none}.input:focus{border-color:#4d8bff;box-shadow:0 0 0 3px rgba(45,108,255,.15)}.table-wrap{overflow:auto;border:1px solid #304463;border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #2a3e5a;text-align:left}.table th{color:#aebbd0;background:#12243d;position:sticky;top:0}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product-card{overflow:hidden;background:#142640;border:1px solid #344b69;border-radius:22px}.product-img{width:100%;height:150px;object-fit:contain;background:#f5f7fb}.product-body{padding:13px}.product-body h4{margin:0 0 4px;font-size:16px}.price{font-size:21px;color:#5e91ff;font-weight:800}.stock{font-size:13px}.stock.ok{color:var(--green)}.stock.low{color:var(--yellow)}.stock.out{color:var(--red)}.product-actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:34px;height:34px;border-radius:11px;background:#1f3e6c}.cart-bar{position:fixed;left:14px;right:14px;bottom:82px;z-index:35;background:#1b3150;border:1px solid #3e5b7f;border-radius:20px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}.cart-bar.hidden{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:rgba(17,31,52,.98);border-top:1px solid #2c4260;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav-btn{background:transparent;color:#7f8ca1;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.nav-btn span:first-child{font-size:22px}.nav-btn.active{color:#4280ff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:#0d1b31;border:1px solid #38506e;border-radius:26px 26px 0 0;padding:18px}.sheet h3{margin:4px 0 16px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.list{display:flex;flex-direction:column;gap:9px}.list-item{display:flex;justify-content:space-between;gap:12px;padding:13px;border-radius:16px;background:#14253e;border:1px solid #2e4563}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#213c63;font-size:12px}.alert{padding:13px;border-radius:16px;border:1px solid #2f4969;background:#13243e;margin-top:10px}.alert.success{border-color:#1c6a4a}.alert.warn{border-color:#80600f}.alert.danger{border-color:#7d2d3b}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{white-space:nowrap;padding:10px 13px;border-radius:13px;background:#142743;border:1px solid #2f4768}.tab.active{background:#2769df}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:35px 10px}.receipt{background:white;color:#111;padding:18px;max-width:390px;margin:auto;font-family:monospace}.receipt h2{text-align:center;margin:0}.receipt .line{display:flex;justify-content:space-between}.receipt hr{border:0;border-top:1px dashed #444}.scanner{position:relative;border-radius:20px;overflow:hidden;background:#050b14;min-height:320px}.scanner video{width:100%;height:360px;object-fit:cover}.scan-frame{position:absolute;inset:24% 15%;border:3px solid #20e0ff;border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(20px);background:#1a2e4b;border:1px solid #496485;border-radius:14px;padding:12px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.switch{display:flex;align-items:center;gap:10px}.switch input{width:48px;height:26px}.danger-text{color:#ff6576}.profile-head{display:flex;align-items:center;gap:14px}.avatar{width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#e21b2d,#ffbf24);display:grid;place-items:center;font-weight:900;font-size:30px}.progress{height:9px;background:#233754;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#2d78ff}.small-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.small-grid .btn{font-size:12px;padding:11px 8px}.footer-note{text-align:center;color:#6f7f95;font-size:12px;padding:20px}.print-only{display:none}
@media(min-width:760px){.product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.quick{grid-template-columns:repeat(4,1fr)}.page{padding:24px}.modal{align-items:center}.sheet{border-radius:26px}.bottom{max-width:900px;left:50%;transform:translateX(-50%);border-radius:24px 24px 0 0}}
@media(max-width:520px){.grid3,.grid4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.hero h2{font-size:24px}.metric strong{font-size:25px}.product-img{height:135px}}
@media print{body{background:white!important;color:black!important}.app>*:not(#printArea),.bottom,.cart-bar,.toast{display:none!important}.print-only{display:block!important}.receipt{box-shadow:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>
<div id="printArea" class="print-only"></div>
<script>
const KEY='eithan_pos_v11_1';
const seedProducts=[
{id:'p1',name:'Harina Doña Blanca',cat:'Abarrotes',barcode:'742100000001',cost:10,sale:13,stock:23,min:5,img:'assets/product-harina.png'},
{id:'p2',name:'Harina Gold Star',cat:'Abarrotes',barcode:'742100000002',cost:9,sale:12,stock:13,min:5,img:'assets/product-goldstar.png'},
{id:'p3',name:'Arroz Manhattan',cat:'Granos',barcode:'742100000003',cost:13,sale:16,stock:25,min:5,img:'assets/product-arroz.png'},
{id:'p4',name:'Arroz Progreso 1LB',cat:'Granos',barcode:'742100000004',cost:13,sale:16,stock:30,min:5,img:'assets/product-progreso.png'},
{id:'p5',name:'Azistín Lavanda',cat:'Limpieza',barcode:'742100000005',cost:18,sale:25,stock:12,min:3,img:'assets/product-limpieza.png'},
{id:'p6',name:'BBQ Kraft',cat:'Salsas',barcode:'742100000006',cost:52,sale:65,stock:5,min:2,img:'assets/product-bbq.png'},
{id:'p7',name:'Conflakes Fans',cat:'Desayuno',barcode:'742100000007',cost:72,sale:90,stock:3,min:1,img:'assets/product-cereal.png'},
{id:'p8',name:'Leche Entera 1L',cat:'Lácteos',barcode:'742100000008',cost:29,sale:35,stock:8,min:2,img:'assets/product-leche.png'}
];
const fresh=()=>({products:structuredClone(seedProducts),sales:[],purchases:[],expenses:[],credits:[],cash:{opening:0,closed:[],lastClose:null},settings:{business:'Mini Súper Eithan',phone:'',address:'',currency:'L',tax:0,receiptFooter:'¡Gracias por su compra!'},cart:[],theme:'dark'});
let db=load(); let route=location.hash.replace('#','')||'home';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?x:fresh()}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return `${db.settings.currency||'L'} ${Number(n||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2})}`}
function today(){return new Date().toISOString().slice(0,10)}
function uid(p='id'){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200)}
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function nav(){return `<nav class="bottom">${[['home','⌂','Inicio'],['pos','▣','Caja'],['inventory','▤','Inventario'],['reports','▥','Reportes'],['more','☰','Más']].map(x=>`<button class="nav-btn ${route===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function top(){return `<header class="topbar"><div class="brand"><img class="logo" src="assets/icon-192.png"><div><h1>Mini Súper Eithan POS</h1><p>V11.1 · Caja e inventario</p></div></div><div class="top-actions"><button class="icon-btn" onclick="openScanner()">▦</button><button class="icon-btn" onclick="go('settings')">⚙</button></div></header>`}
function shell(content){document.getElementById('app').innerHTML=top()+`<main class="page">${content}</main>`+nav()}
function go(r){route=r;location.hash=r;render()}
function totals(){const d=today();const sales=db.sales.filter(s=>s.date===d);return {sales:sales.reduce((a,s)=>a+s.total,0),profit:sales.reduce((a,s)=>a+s.profit,0),count:sales.length,low:db.products.filter(p=>p.stock<=p.min).length,units:db.products.reduce((a,p)=>a+p.stock,0),inventory:db.products.reduce((a,p)=>a+p.cost*p.stock,0)}}
function render(){if(route==='home')home();else if(route==='pos')pos();else if(route==='inventory')inventory();else if(route==='reports')reports();else if(route==='purchases')purchases();else if(route==='credits')credits();else if(route==='expenses')expenses();else if(route==='scanner')scanner();else if(route==='profile')profile();else if(route==='settings')settings();else more()}
function home(){const t=totals();shell(`<section class="hero"><h2>¡Listo para vender! 🛒</h2><p>Tu caja, inventario, compras y ganancias en un solo lugar.</p></section><div class="grid2"><div class="card metric"><small>Ventas hoy</small><strong>${money(t.sales)}</strong></div><div class="card metric"><small>Ganancia hoy</small><strong class="green">${money(t.profit)}</strong></div><div class="card metric"><small>Productos</small><strong class="yellow">${db.products.length}</strong></div><div class="card metric"><small>Stock bajo</small><strong class="red">${t.low}</strong></div></div><div class="section-title"><h3>⚡ Acciones rápidas</h3></div><div class="quick"><button class="btn primary" onclick="go('pos')">🧾 Nueva venta</button><button class="btn" onclick="productForm()">➕ Producto</button><button class="btn" onclick="openScanner()">▦ Escanear</button><button class="btn warn" onclick="inventoryLow()">🔔 Stock bajo</button><button class="btn" onclick="go('purchases')">🚚 Compra</button><button class="btn" onclick="go('expenses')">💸 Gasto</button><button class="btn" onclick="go('credits')">👥 Fiados</button><button class="btn" onclick="closeCash()">🔒 Cerrar caja</button></div><div class="section-title"><h3>🔔 Alertas</h3></div>${t.low?`<div class="alert warn">Tienes <b>${t.low}</b> productos en stock bajo. <button class="btn small" onclick="inventoryLow()">Ver</button></div>`:`<div class="alert success">✅ No tienes productos por debajo del stock mínimo.</div>`}<div class="section-title"><h3>Resumen rápido</h3><button class="btn small" onclick="go('reports')">Ver reportes</button></div><div class="grid3"><div class="card metric"><small>Unidades en stock</small><strong>${t.units}</strong></div><div class="card metric"><small>Valor costo inventario</small><strong>${money(t.inventory)}</strong></div><div class="card metric"><small>Tickets hoy</small><strong>${t.count}</strong></div></div>`)}
function pos(){let q=''; const cats=[...new Set(db.products.map(p=>p.cat))];shell(`<div class="section-title"><h2 style="margin:0">Caja</h2><button class="btn primary" onclick="openScanner()">▦ Escanear</button></div><div class="searchbar"><input id="posSearch" class="input" placeholder="Buscar producto o código..." oninput="filterPOS(this.value)"></div><div class="tabs"><button class="tab active" onclick="filterPOS('')">Todos</button>${cats.map(c=>`<button class="tab" onclick="filterPOS(${JSON.stringify(c)})">${esc(c)}</button>`).join('')}</div><div id="posProducts" class="product-grid">${productCards(db.products)}</div>`);}
function productCards(products){return products.map(p=>`<article class="product-card"><img class="product-img" src="${p.img||'assets/icon-512.png'}" onerror="this.src='assets/icon-512.png'"><div class="product-body"><h4>${esc(p.name)}</h4><div class="stock ${p.stock===0?'out':p.stock<=p.min?'low':'ok'}">Stock: ${p.stock} uds.</div><div class="product-actions"><span class="price">${money(p.sale)}</span><button class="btn small primary" onclick="addCart('${p.id}')">＋</button></div></div></article>`).join('')||`<div class="empty">No hay productos.</div>`}
function filterPOS(q){const term=String(q||'').toLowerCase();const ps=db.products.filter(p=>!term||p.name.toLowerCase().includes(term)||p.barcode.includes(term)||p.cat.toLowerCase().includes(term));document.getElementById('posProducts').innerHTML=productCards(ps);}
function addCart(id){const p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return toast('Producto sin stock');const it=db.cart.find(x=>x.id===id);if(it){if(it.qty>=p.stock)return toast('No hay más stock');it.qty++}else db.cart.push({id,qty:1});save();cartBar();toast('Agregado a la venta')}
function cartBar(){document.querySelectorAll('.cart-bar').forEach(x=>x.remove());if(!db.cart.length)return;const total=db.cart.reduce((a,i)=>a+(db.products.find(p=>p.id===i.id)?.sale||0)*i.qty,0);const qty=db.cart.reduce((a,i)=>a+i.qty,0);document.body.insertAdjacentHTML('beforeend',`<div class="cart-bar"><div><b>${qty} artículos</b><br><span class="muted">Total ${money(total)}</span></div><button class="btn primary" onclick="openCart()">Cobrar →</button></div>`)}
function openCart(){if(!db.cart.length)return;const rows=db.cart.map(i=>{const p=db.products.find(p=>p.id===i.id);return `<div class="list-item"><div><b>${esc(p.name)}</b><div class="muted">${money(p.sale)} c/u</div></div><div class="qty"><button onclick="changeQty('${p.id}',-1)">−</button><b>${i.qty}</b><button onclick="changeQty('${p.id}',1)">＋</button></div></div>`}).join('');const total=db.cart.reduce((a,i)=>a+(db.products.find(p=>p.id===i.id)?.sale||0)*i.qty,0);openModal(`<h3>🛒 Venta actual</h3><div class="list">${rows}</div><div class="card" style="margin-top:12px"><div class="line"><span>Subtotal</span><b>${money(total)}</b></div><div class="line"><span>Descuento</span><input id="discount" class="input" type="number" min="0" value="0" style="max-width:130px"></div><div class="line"><span>Total</span><b id="modalTotal" class="price">${money(total)}</b></div><div class="actions"><button class="btn success" onclick="checkout('Efectivo')">💵 Efectivo</button><button class="btn" onclick="checkout('Transferencia')">📱 Transferencia</button><button class="btn" onclick="checkout('Tarjeta')">💳 Tarjeta</button><button class="btn warn" onclick="checkout('Fiado')">👤 Fiado</button></div></div>`)}
function changeQty(id,d){const it=db.cart.find(x=>x.id===id);const p=db.products.find(x=>x.id===id);if(!it)return;if(d>0&&it.qty>=p.stock)return;if(it.qty+d<=0)db.cart=db.cart.filter(x=>x.id!==id);else it.qty+=d;save();closeModal();openCart();cartBar()}
function checkout(method){const discount=Number(document.getElementById('discount')?.value||0);let subtotal=0,profit=0;const items=db.cart.map(i=>{const p=db.products.find(x=>x.id===i.id);const line=p.sale*i.qty;subtotal+=line;profit+=(p.sale-p.cost)*i.qty;return {id:p.id,name:p.name,qty:i.qty,price:p.sale,cost:p.cost,line}});const total=Math.max(0,subtotal-discount);items.forEach(i=>{const p=db.products.find(x=>x.id===i.id);p.stock-=i.qty});const sale={id:uid('s'),date:today(),time:new Date().toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit'}),items,subtotal,discount,total,profit:profit-discount,payment:method};db.sales.push(sale);if(method==='Fiado')db.credits.push({id:uid('c'),date:today(),name:'Cliente mostrador',amount:total,paid:0,status:'Pendiente',saleId:sale.id});db.cart=[];save();closeModal();cartBar();render();receipt(sale);toast('Venta registrada correctamente')}
function receipt(s){const html=`<div class="receipt"><h2>${esc(db.settings.business)}</h2><div style="text-align:center">${esc(db.settings.address||'') }<br>${esc(db.settings.phone||'')}</div><hr><div>Fecha: ${s.date} ${s.time}</div><hr>${s.items.map(i=>`<div class="line"><span>${i.qty}x ${esc(i.name)}</span><span>${money(i.line)}</span></div>`).join('')}<hr><div class="line"><span>Subtotal</span><b>${money(s.subtotal)}</b></div><div class="line"><span>Descuento</span><b>${money(s.discount)}</b></div><div class="line"><span>TOTAL</span><b>${money(s.total)}</b></div><div style="text-align:center;margin-top:12px">Pago: ${esc(s.payment)}<br>${esc(db.settings.receiptFooter)}</div></div>`;document.getElementById('printArea').innerHTML=html;openModal(`<h3>🧾 Recibo</h3>${html}<div class="actions"><button class="btn primary" onclick="window.print()">🖨️ Imprimir</button><button class="btn" onclick="shareReceipt(${JSON.stringify(s.id)})">📤 Compartir</button><button class="btn" onclick="closeModal()">Cerrar</button></div>`)}
async function shareReceipt(id){const s=db.sales.find(x=>x.id===id);const text=`${db.settings.business}\nVenta ${s.id}\nTotal: ${money(s.total)}\nPago: ${s.payment}\n${s.items.map(i=>`${i.qty}x ${i.name}: ${money(i.line)}`).join('\n')}`;if(navigator.share){try{await navigator.share({title:'Recibo Mini Súper Eithan',text})}catch(e){}}else{await navigator.clipboard?.writeText(text);toast('Recibo copiado para compartir')}}
function inventory(){shell(`<div class="section-title"><h2 style="margin:0">Mi Inventario</h2><button class="btn primary" onclick="productForm()">＋ Añadir</button></div><div class="card metric"><small>Valor del inventario a costo</small><strong>${money(totals().inventory)}</strong><div class="muted">${totals().units} unidades · ${db.products.length} productos</div></div><div class="section-title"><h3>Productos</h3><div class="small-grid"><button class="btn" onclick="exportData()">Backup</button><button class="btn" onclick="importData()">Restaurar</button><button class="btn" onclick="inventoryLow()">Stock bajo</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Producto</th><th>Código</th><th>Costo</th><th>Venta</th><th>Stock</th><th>Mín.</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="muted">${esc(p.cat)}</span></td><td>${esc(p.barcode)}</td><td>${money(p.cost)}</td><td>${money(p.sale)}</td><td class="${p.stock<=p.min?'red':'green'}">${p.stock}</td><td>${p.min}</td><td><button class="btn small" onclick="productForm('${p.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`)}
function productForm(id){const p=id?db.products.find(x=>x.id===id):{name:'',cat:'Abarrotes',barcode:'',cost:0,sale:0,stock:0,min:2,img:''};openModal(`<h3>${id?'✏️ Editar producto':'➕ Nuevo producto'}</h3><div class="form-grid"><div class="field"><label>Nombre</label><input id="fName" class="input" value="${esc(p.name)}"></div><div class="field"><label>Categoría</label><input id="fCat" class="input" value="${esc(p.cat)}"></div><div class="field"><label>Código de barras</label><input id="fBarcode" class="input" value="${esc(p.barcode)}" inputmode="numeric"></div><div class="field"><label>Costo</label><input id="fCost" class="input" type="number" step="0.01" value="${p.cost}"></div><div class="field"><label>Precio de venta</label><input id="fSale" class="input" type="number" step="0.01" value="${p.sale}"></div><div class="field"><label>Stock actual</label><input id="fStock" class="input" type="number" value="${p.stock}"></div><div class="field"><label>Stock mínimo</label><input id="fMin" class="input" type="number" value="${p.min}"></div><div class="field"><label>Imagen URL opcional</label><input id="fImg" class="input" value="${esc(p.img||'')}"></div></div><div class="actions"><button class="btn primary" onclick="saveProduct('${id||''}')">Guardar</button>${id?`<button class="btn danger" onclick="deleteProduct('${id}')">Eliminar</button>`:''}<button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
function saveProduct(id){const o={name:document.getElementById('fName').value.trim(),cat:document.getElementById('fCat').value.trim()||'Otros',barcode:document.getElementById('fBarcode').value.trim(),cost:Number(document.getElementById('fCost').value),sale:Number(document.getElementById('fSale').value),stock:Number(document.getElementById('fStock').value),min:Number(document.getElementById('fMin').value),img:document.getElementById('fImg').value.trim()};if(!o.name||o.sale<0||o.stock<0)return toast('Completa los datos correctamente');if(id)Object.assign(db.products.find(x=>x.id===id),o);else db.products.push({...o,id:uid('p')});save();closeModal();render();toast('Producto guardado')}
function deleteProduct(id){if(confirm('¿Eliminar producto?')){db.products=db.products.filter(x=>x.id!==id);save();closeModal();render();}}
function inventoryLow(){const ps=db.products.filter(p=>p.stock<=p.min);openModal(`<h3>🔔 Stock bajo</h3>${ps.length?`<div class="list">${ps.map(p=>`<div class="list-item"><div><b>${esc(p.name)}</b><div class="red">Stock ${p.stock} / mínimo ${p.min}</div></div><button class="btn small" onclick="productForm('${p.id}')">Reponer</button></div>`).join('')}</div>`:'<div class="alert success">Todo está en niveles normales.</div>'}`)}
function reports(){const t=totals();const byProd={};db.sales.forEach(s=>s.items.forEach(i=>{byProd[i.name]=(byProd[i.name]||0)+i.line}));const best=Object.entries(byProd).sort((a,b)=>b[1]-a[1]).slice(0,5);shell(`<div class="section-title"><h2 style="margin:0">Reportes</h2><button class="btn" onclick="exportCSV()">⬇ CSV</button></div><div class="grid3"><div class="card metric"><small>Total vendido hoy</small><strong>${money(t.sales)}</strong></div><div class="card metric"><small>Ganancia hoy</small><strong class="green">${money(t.profit)}</strong></div><div class="card metric"><small>Fiado pendiente</small><strong class="yellow">${money(db.credits.filter(c=>c.status!=='Pagado').reduce((a,c)=>a+c.amount-c.paid,0))}</strong></div></div><div class="section-title"><h3>📊 Productos más vendidos</h3></div><div class="card list">${best.length?best.map((x,i)=>`<div class="list-item"><span>#${i+1} ${esc(x[0])}</span><b>${money(x[1])}</b></div>`).join(''):'<div class="empty">Aún no hay ventas.</div>'}</div><div class="section-title"><h3>🧾 Historial de ventas</h3></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Hora</th><th>Items</th><th>Total</th><th>Pago</th><th></th></tr></thead><tbody>${db.sales.slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${s.time}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${money(s.total)}</td><td>${esc(s.payment)}</td><td><button class="btn small" onclick="receipt(${JSON.stringify(s)})">Recibo</button></td></tr>`).join('')||'<tr><td colspan="6">Sin ventas.</td></tr>'}</tbody></table></div>`)}
function purchases(){shell(`<div class="section-title"><h2 style="margin:0">Compras</h2><button class="btn primary" onclick="purchaseForm()">＋ Nueva compra</button></div><div class="alert">Registra entradas de mercancía para aumentar stock y conocer cuánto has invertido.</div><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Fecha</th><th>Proveedor</th><th>Detalle</th><th>Total</th></tr></thead><tbody>${db.purchases.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.supplier)}</td><td>${esc(p.note)}</td><td>${money(p.total)}</td></tr>`).join('')||'<tr><td colspan="4">Sin compras.</td></tr>'}</tbody></table></div>`)}
function purchaseForm(){openModal(`<h3>🚚 Registrar compra</h3><div class="form-grid"><div class="field"><label>Proveedor</label><input id="puSupplier" class="input"></div><div class="field"><label>Total pagado</label><input id="puTotal" class="input" type="number"></div><div class="field" style="grid-column:1/-1"><label>Detalle</label><textarea id="puNote" class="input" rows="3" placeholder="Ej. 2 fardos de Maseca, 1 caja de refrescos..."></textarea></div></div><div class="actions"><button class="btn primary" onclick="savePurchase()">Guardar compra</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
function savePurchase(){db.purchases.push({id:uid('pu'),date:today(),supplier:document.getElementById('puSupplier').value||'Sin proveedor',total:Number(document.getElementById('puTotal').value)||0,note:document.getElementById('puNote').value||''});save();closeModal();render();toast('Compra registrada')}
function expenses(){const total=db.expenses.filter(e=>e.date===today()).reduce((a,e)=>a+e.amount,0);shell(`<div class="section-title"><h2 style="margin:0">Gastos</h2><button class="btn primary" onclick="expenseForm()">＋ Registrar gasto</button></div><div class="card metric"><small>Gastos de hoy</small><strong class="red">${money(total)}</strong></div><div class="list" style="margin-top:14px">${db.expenses.slice().reverse().map(e=>`<div class="list-item"><div><b>${esc(e.category)}</b><div class="muted">${e.date} · ${esc(e.note)}</div></div><strong class="red">-${money(e.amount)}</strong></div>`).join('')||'<div class="empty">Sin gastos registrados.</div>'}</div>`)}
function expenseForm(){openModal(`<h3>💸 Registrar gasto</h3><div class="form-grid"><div class="field"><label>Categoría</label><select id="exCat" class="input"><option>Alquiler</option><option>Energía</option><option>Internet</option><option>Transporte</option><option>Compra de negocio</option><option>Otro</option></select></div><div class="field"><label>Monto</label><input id="exAmount" class="input" type="number" step="0.01"></div><div class="field" style="grid-column:1/-1"><label>Nota</label><input id="exNote" class="input"></div></div><div class="actions"><button class="btn primary" onclick="saveExpense()">Guardar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
function saveExpense(){db.expenses.push({id:uid('e'),date:today(),category:document.getElementById('exCat').value,amount:Number(document.getElementById('exAmount').value)||0,note:document.getElementById('exNote').value||''});save();closeModal();render()}
function credits(){const pending=db.credits.filter(c=>c.status!=='Pagado').reduce((a,c)=>a+c.amount-c.paid,0);shell(`<div class="section-title"><h2 style="margin:0">👥 Fiados</h2><button class="btn primary" onclick="creditForm()">＋ Nuevo</button></div><div class="card metric"><small>Total pendiente</small><strong class="yellow">${money(pending)}</strong></div><div class="list" style="margin-top:14px">${db.credits.slice().reverse().map(c=>`<div class="list-item"><div><b>${esc(c.name)}</b><div class="muted">${c.date} · ${c.status}</div></div><div style="text-align:right"><strong>${money(c.amount-c.paid)}</strong><br><button class="btn small" onclick="payCredit('${c.id}')">Registrar pago</button></div></div>`).join('')||'<div class="empty">No hay fiados.</div>'}</div>`)}
function creditForm(){openModal(`<h3>👤 Nuevo fiado</h3><div class="form-grid"><div class="field"><label>Cliente</label><input id="crName" class="input"></div><div class="field"><label>Monto</label><input id="crAmount" class="input" type="number"></div></div><div class="actions"><button class="btn primary" onclick="saveCredit()">Guardar</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
function saveCredit(){db.credits.push({id:uid('c'),date:today(),name:document.getElementById('crName').value||'Cliente',amount:Number(document.getElementById('crAmount').value)||0,paid:0,status:'Pendiente'});save();closeModal();render()}
function payCredit(id){const c=db.credits.find(x=>x.id===id);const n=Number(prompt(`Saldo pendiente ${money(c.amount-c.paid)}. ¿Cuánto paga?`,c.amount-c.paid));if(!n)return;c.paid=Math.min(c.amount,c.paid+n);c.status=c.paid>=c.amount?'Pagado':'Abono';save();render();}
let scannerStream=null,scanTimer=null;
function openScanner(){openModal(`<h3>▦ Escáner inteligente</h3><div class="scanner"><video id="video" autoplay playsinline></video><div class="scan-frame"></div></div><div class="actions"><input id="manualCode" class="input" placeholder="O escribe el código aquí..." inputmode="numeric"><button class="btn primary" onclick="manualScan()">⚡ Buscar</button><button class="btn" onclick="stopScanner();closeModal()">Cerrar</button></div><p class="muted">Si tu iPhone no permite el escaneo en el navegador, usa el campo manual. Para lectores Bluetooth/USB, deja el cursor en el campo.</p>`);startScanner()}
async function startScanner(){try{scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=document.getElementById('video');if(v){v.srcObject=scannerStream;startDetect(v)}}catch(e){toast('Permiso de cámara no disponible; usa el código manual')}}
async function startDetect(v){if(!('BarcodeDetector' in window))return;let detector;try{detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128','qr_code']})}catch(e){detector=new BarcodeDetector()}scanTimer=setInterval(async()=>{if(!v||v.readyState<2)return;try{const codes=await detector.detect(v);if(codes[0]?.rawValue){findBarcode(codes[0].rawValue);stopScanner();closeModal()}}catch(e){}},700)}
function stopScanner(){if(scanTimer)clearInterval(scanTimer);if(scannerStream)scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null}
function manualScan(){const c=document.getElementById('manualCode').value.trim();findBarcode(c)}
function findBarcode(code){const p=db.products.find(x=>x.barcode===code);if(!p)return toast('Código no encontrado');closeModal();route='pos';render();addCart(p.id);}
function profile(){shell(`<div class="section-title"><h2 style="margin:0">Perfil</h2></div><div class="card profile-head"><div class="avatar">E</div><div><h2 style="margin:0">${esc(db.settings.business)}</h2><div class="muted">${esc(db.settings.phone||'Sin teléfono')}</div><div class="muted">${esc(db.settings.address||'Sin dirección')}</div></div></div><div class="section-title"><h3>Cuenta</h3></div><div class="list"><button class="list-item" onclick="businessForm()">🏪 <span style="flex:1;text-align:left"><b>Información del negocio</b><br><span class="muted">Nombre, teléfono y dirección</span></span>›</button><button class="list-item" onclick="go('purchases')">🚚 <span style="flex:1;text-align:left"><b>Proveedores y compras</b><br><span class="muted">Control de entradas</span></span>›</button><button class="list-item" onclick="go('credits')">💵 <span style="flex:1;text-align:left"><b>Fiados</b><br><span class="muted">Créditos y cobros pendientes</span></span>›</button><button class="list-item" onclick="go('settings')">⚙️ <span style="flex:1;text-align:left"><b>Configuración</b><br><span class="muted">Ajustes de la aplicación</span></span>›</button></div>`)}
function businessForm(){openModal(`<h3>🏪 Información del negocio</h3><div class="form-grid"><div class="field"><label>Nombre</label><input id="bName" class="input" value="${esc(db.settings.business)}"></div><div class="field"><label>Teléfono</label><input id="bPhone" class="input" value="${esc(db.settings.phone)}"></div><div class="field" style="grid-column:1/-1"><label>Dirección</label><input id="bAddress" class="input" value="${esc(db.settings.address)}"></div></div><div class="actions"><button class="btn primary" onclick="saveBusiness()">Guardar</button></div>`)}
function saveBusiness(){db.settings.business=document.getElementById('bName').value||'Mini Súper Eithan';db.settings.phone=document.getElementById('bPhone').value;db.settings.address=document.getElementById('bAddress').value;save();closeModal();render()}
function settings(){shell(`<div class="section-title"><h2 style="margin:0">Configuración</h2></div><div class="list"><div class="list-item"><span><b>Moneda</b><br><span class="muted">Símbolo para precios</span></span><input id="currency" class="input" value="${esc(db.settings.currency)}" style="max-width:90px" onchange="db.settings.currency=this.value;save();render()"></div><div class="list-item"><span><b>Impuesto</b><br><span class="muted">Porcentaje informativo</span></span><input id="tax" class="input" type="number" value="${db.settings.tax}" style="max-width:100px" onchange="db.settings.tax=Number(this.value);save()"></div><div class="list-item"><span><b>Mensaje del recibo</b><br><span class="muted">Texto al final del ticket</span></span><input class="input" value="${esc(db.settings.receiptFooter)}" onchange="db.settings.receiptFooter=this.value;save()"></div></div><div class="section-title"><h3>Datos</h3></div><div class="quick"><button class="btn" onclick="exportData()">⬇️ Exportar respaldo</button><button class="btn" onclick="importData()">⬆️ Importar respaldo</button><button class="btn" onclick="exportCSV()">📊 Exportar ventas CSV</button><button class="btn danger" onclick="resetData()">♻️ Restablecer app</button></div>`)}
function more(){shell(`<div class="section-title"><h2 style="margin:0">Más</h2></div><div class="quick"><button class="btn" onclick="go('profile')">👤 Perfil</button><button class="btn" onclick="go('purchases')">🚚 Compras</button><button class="btn" onclick="go('expenses')">💸 Gastos</button><button class="btn" onclick="go('credits')">👥 Fiados</button><button class="btn" onclick="go('scanner')">▦ Escáner</button><button class="btn" onclick="go('settings')">⚙️ Configuración</button></div><div class="card" style="margin-top:16px"><h3>Mini Súper Eithan POS V11.1</h3><p class="muted">PWA offline · ventas · inventario · compras · gastos · fiados · reportes · respaldo · recibos.</p></div>`)}
function scanner(){shell(`<div class="section-title"><h2 style="margin:0">Escáner inteligente</h2><button class="btn primary" onclick="openScanner()">Abrir cámara</button></div><div class="alert">Puedes escanear códigos de barras desde la cámara cuando el navegador lo soporte o escribir el código manualmente.</div>`)}
function closeCash(){const t=totals();openModal(`<h3>🔒 Cierre de caja</h3><div class="card"><div class="line"><span>Ventas del día</span><b>${money(t.sales)}</b></div><div class="line"><span>Gastos del día</span><b>${money(db.expenses.filter(e=>e.date===today()).reduce((a,e)=>a+e.amount,0))}</b></div><div class="line"><span>Ganancia bruta</span><b class="green">${money(t.profit)}</b></div></div><div class="field" style="margin-top:12px"><label>Efectivo contado en caja</label><input id="cashCount" class="input" type="number"></div><div class="actions"><button class="btn primary" onclick="saveClose()">Confirmar cierre</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`)}
function saveClose(){db.cash.closed.push({id:uid('z'),date:today(),time:new Date().toLocaleTimeString('es-HN'),sales:totals().sales,counted:Number(document.getElementById('cashCount').value)||0});db.cash.lastClose=db.cash.closed.at(-1);save();closeModal();toast('Caja cerrada y guardada')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Mini_Super_Eithan_Backup_${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.products||!x.sales)throw Error();db=x;save();render();toast('Respaldo restaurado')}catch(e){toast('Archivo no válido')}};r.readAsText(f)};i.click()}
function exportCSV(){const rows=[['Fecha','Hora','Total','Ganancia','Pago','Productos'],...db.sales.map(s=>[s.date,s.time,s.total,s.profit,s.payment,s.items.map(i=>`${i.qty}x ${i.name}`).join(' | ')] )];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`ventas_eithan_${today()}.csv`;a.click()}
function resetData(){if(confirm('Esto borrará ventas, productos y configuración local. ¿Continuar?')){db=fresh();save();render();toast('Aplicación restablecida')}}
window.addEventListener('hashchange',()=>{route=location.hash.replace('#','')||'home';render()});
render();cartBar();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
