<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest">
<title>Mini Súper Eithan V8</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;position:sticky;top:0;background:#0b1220ee;backdrop-filter:blur(12px);z-index:5}
.logo{background:linear-gradient(135deg,#991b1b,#ef4444);padding:10px 13px;border-radius:17px;font-weight:900;line-height:.95}.logo span{color:#fde047;font-size:20px}.logo small{display:block;margin-top:5px;font-size:8px}
h1{font-size:30px;margin:0;flex:1}.sun{background:none;color:#fff;border:0;font-size:25px}
.searchrow{display:flex;gap:9px;padding:8px 18px}.search{flex:1;padding:15px;border-radius:18px;border:1px solid #2a3850;background:#172235;color:#fff;font-size:16px}.scan{border:1px solid #2563eb;background:#17346e;color:#60a5fa;border-radius:18px;padding:0 15px;font-weight:800}
.cats{display:flex;gap:8px;overflow:auto;padding:8px 18px 14px}.cat{background:#172235;color:#cbd5e1;border:1px solid #2a3850;border-radius:12px;padding:10px 14px;white-space:nowrap}.cat.active{background:#2563eb;color:#fff}
.layout{display:grid;grid-template-columns:1fr 330px;gap:14px;padding:0 18px 95px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:#172235;border:1px solid #2a3850;border-radius:20px;overflow:hidden;position:relative;transition:.15s}.card:active{transform:scale(.98)}
.pic{height:190px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:80px}.info{padding:12px}.name{font-size:18px;font-weight:800}.code{font-size:12px;color:#60a5fa;margin-top:5px}.stock{color:#22c55e;margin-top:5px}.price{font-size:25px;color:#60a5fa;font-weight:900;margin-top:8px}.add{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;background:#2563eb;color:white;font-size:28px}
.detail{background:#111a2a;border:1px solid #2a3850;border-radius:20px;padding:16px;position:sticky;top:90px;height:max-content}.selected{display:flex;gap:12px}.thumb{width:80px;height:80px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:42px}.barbox{margin-top:15px;padding:12px;background:#0b1220;border:1px solid #2a3850;border-radius:14px}.bars{height:55px;margin:8px 0;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px)}.bartext{text-align:center;letter-spacing:2px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #2a3850;font-size:14px}.actions{display:flex;gap:8px;margin-top:12px}.btn{padding:11px 13px;border-radius:11px;background:#2563eb;color:#fff;font-weight:800;border:0}.empty{text-align:center;color:#94a3b8;padding:35px 10px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#172235f5;border-top:1px solid #2a3850;display:flex;justify-content:space-around;padding:8px;z-index:6}.nav{background:none;border:0;color:#64748b;font-size:11px}.nav b{display:block;font-size:22px}.nav.active{color:#60a5fa}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{background:#172235;width:100%;border-radius:24px 24px 0 0;padding:20px}.close{float:right;background:#334155;color:#fff;border:0;padding:9px 12px;border-radius:10px}.camera{height:230px;border:2px dashed #3b82f6;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;color:#93c5fd}.manual{display:flex;gap:8px;margin-top:12px}.manual input{flex:1;padding:13px;background:#0b1220;color:#fff;border:1px solid #2a3850;border-radius:12px}
@media(max-width:800px){.layout{display:block}.detail{display:none}.pic{height:165px}}

.hero-eithan{margin:0 18px 14px;border-radius:22px;overflow:hidden;border:1px solid #2a3850;background:#111827;box-shadow:0 10px 30px #0006}
.hero-eithan img{display:block;width:100%;height:auto;max-height:330px;object-fit:cover}
.hero-caption{padding:10px 14px;background:#111827;color:#fff;font-weight:800;font-size:15px}
</style></head><body>
<header class="top"><div class="logo">🛒 MINI SÚPER<br><span>EITHAN</span><small>¡Siempre cerca de ti!</small></div><h1>Caja</h1><button class="sun" onclick="alert('Modo oscuro V8 activo')">☀️</button></header>
<section class="hero-eithan"><img src="eithan-portada.jpg" alt="Pulpería Eithan"><div class="hero-caption">🛒 Pulpería Eithan · De todo para tu hogar</div></section>
<div class="searchrow"><input id="q" class="search" placeholder="Buscar producto por nombre o código..." oninput="render()"><button class="scan" onclick="openScan()">▣ Escanear</button></div>
<div id="cats" class="cats"></div>
<main class="layout"><section><div id="grid" class="grid"></div></section><aside id="detail" class="detail"><div class="empty">Selecciona un producto para ver su código de barras, precio, costo y stock.</div></aside></main>
<nav class="bottom"><button class="nav active"><b>🧾</b>Caja</button><button class="nav"><b>📦</b>Inventario</button><button class="nav"><b>🛒</b>Ventas</button><button class="nav"><b>📊</b>Reportes</button><button class="nav"><b>•••</b>Más</button></nav>
<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeScan()">Cerrar</button><h2>Escanear código de barras</h2><div class="camera">Apunta la cámara al código.<br>Si el iPhone no detecta automáticamente, escribe el código abajo.</div><div class="manual"><input id="barcode" inputmode="numeric" placeholder="Código de barras"><button class="btn" onclick="findCode()">Buscar</button></div></div></div>
<script>
const P=[
["Arina Doña Blanca","7501000111005",23,13,9.5,"Abarrotes","🌾"],["Arina Gold Star","7421000105008",13,12,8.5,"Abarrotes","🌾"],["Arroz Manhattan","7421000203001",25,16,12,"Abarrotes","🍚"],["Arroz Progreso 1LB","7421000201007",30,16,12.5,"Abarrotes","🍚"],["Fabuloso Lavanda","7501035912345",12,28,22,"Limpieza","🧴"],["Salsa BBQ Kraft","021500010007",8,55,45,"Abarrotes","🥫"],["Frijoles","7501000999001",18,24,20,"Abarrotes","🫘"],["Leche","7501000123456",10,32,27,"Lácteos","🥛"]];
let cat="Todos",sel=null;
function render(){let q=document.getElementById("q").value.toLowerCase();let cats=["Todos",...new Set(P.map(x=>x[5]))];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${c==cat?"active":""}" onclick="cat='${c}';render()">${c}</button>`).join("");let list=P.filter(x=>(cat=="Todos"||x[5]==cat)&&(x[0].toLowerCase().includes(q)||x[1].includes(q)));document.getElementById("grid").innerHTML=list.map(x=>`<article class="card" onclick="select('${x[1]}')"><div class="pic">${x[6]}</div><div class="info"><div class="name">${x[0]}</div><div class="code">Código: ${x[1]}</div><div class="stock">Stock: ${x[2]} uds.</div><div class="price">L ${x[3].toFixed(2)}</div></div><button class="add" onclick="event.stopPropagation();sale('${x[1]}')">+</button></article>`).join("")||'<div class="empty">No se encontró el producto.</div>'}
function select(code){sel=P.find(x=>x[1]==code);let g=sel[3]-sel[4];document.getElementById("detail").innerHTML=`<div class="selected"><div class="thumb">${sel[6]}</div><div><small>Producto seleccionado</small><h3>${sel[0]}</h3><div style="color:#22c55e">Stock: ${sel[2]} uds.</div><strong style="font-size:25px;color:#60a5fa">L ${sel[3].toFixed(2)}</strong></div></div><div class="barbox"><b>Código de barras</b><div class="bars"></div><div class="bartext">${sel[1]}</div><div class="actions"><button class="btn" onclick="navigator.clipboard?.writeText(sel[1]);alert('Código copiado')">▣ Copiar</button><button class="btn" onclick="window.print()">🖨 Imprimir</button></div></div><div class="row"><span>Código</span><b>${sel[1]}</b></div><div class="row"><span>Categoría</span><span>${sel[5]}</span></div><div class="row"><span>Precio de venta</span><span>L ${sel[3].toFixed(2)}</span></div><div class="row"><span>Precio de costo</span><span>L ${sel[4].toFixed(2)}</span></div><div class="row"><span>Ganancia</span><span style="color:#22c55e">L ${g.toFixed(2)}</span></div><div class="row"><span>Stock actual</span><span style="color:#22c55e">${sel[2]} unidades</span></div>`}
function sale(code){let p=P.find(x=>x[1]==code);if(p[2]>0){p[2]--;alert("Agregado a la venta: "+p[0]);render();select(code)}}
function openScan(){document.getElementById("modal").classList.add("open")}function closeScan(){document.getElementById("modal").classList.remove("open")}
function findCode(){let c=document.getElementById("barcode").value.trim();let p=P.find(x=>x[1]==c);if(p){closeScan();document.getElementById("q").value=c;cat="Todos";render();select(c)}else alert("Código no encontrado")}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
