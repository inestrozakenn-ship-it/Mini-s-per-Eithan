<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071426">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.svg">
<title>Mini Súper Eithan POS V11</title>
<style>
:root{--bg:#071426;--panel:#0d1b31;--panel2:#12233d;--line:#27405f;--text:#f6f8fb;--muted:#9cafc8;--blue:#2f80ed;--green:#20c77a;--red:#ff5b6e;--yellow:#ffbd2e}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061122,#091a31);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer}.app{min-height:100vh;padding-bottom:76px}.top{position:sticky;top:0;z-index:20;background:rgba(6,17,34,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 14px 10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;border-radius:13px}.brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}.search{margin-top:10px;display:flex;gap:8px}.search input{flex:1;background:#101f35;border:1px solid var(--line);color:#fff;border-radius:14px;padding:13px 14px;outline:none}.search button{background:#1d3557;color:#fff;border-radius:14px;padding:0 15px}.page{padding:14px;max-width:1100px;margin:auto}.hero{border:1px solid var(--line);background:linear-gradient(135deg,#10284a,#0b172a);border-radius:20px;padding:16px;margin-bottom:14px}.hero h2{margin:0 0 5px;font-size:24px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:linear-gradient(145deg,#10223b,#0c192d);border:1px solid var(--line);border-radius:18px;padding:15px}.label{color:var(--muted);font-size:13px}.value{font-size:25px;font-weight:800;margin-top:6px}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-title h3{margin:0;font-size:18px}.btn{background:#173252;color:#fff;border:1px solid #31537b;border-radius:12px;padding:10px 13px}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn.success{background:#118a58;border-color:#118a58}.btn.danger{background:#8f2637;border-color:#8f2637}.btn.warn{background:#8b6410;border-color:#b3831b}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.actions .btn{padding:15px;text-align:left}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{background:#0d1c31;border:1px solid var(--line);border-radius:17px;overflow:hidden}.product img{width:100%;height:115px;object-fit:cover;background:#15253c}.product-body{padding:11px}.product-name{font-weight:700;min-height:40px}.product-meta{font-size:12px;color:var(--muted);margin:4px 0}.price{font-size:18px;font-weight:800}.product-footer{display:flex;gap:7px;margin-top:9px}.product-footer button{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(7,20,38,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.navbtn{background:none;color:#8ea2bc;font-size:11px;padding:5px}.navbtn.active{color:#fff}.navbtn b{display:block;font-size:20px;margin-bottom:2px}.list{display:flex;flex-direction:column;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0d1c31;border:1px solid var(--line);padding:11px;border-radius:14px}.row-main{min-width:0}.row-main strong{display:block}.row-main small{color:var(--muted)}.pill{padding:5px 8px;border-radius:999px;background:#183251;color:#cfe2ff;font-size:11px}.pill.low{background:#5a222c;color:#ffb2bd}.fab{position:fixed;right:16px;bottom:88px;z-index:25;background:var(--yellow);color:#17110a;width:56px;height:56px;border-radius:50%;font-size:25px;box-shadow:0 8px 25px #0008}.cart-count{position:absolute;right:-3px;top:-3px;background:var(--red);color:white;border-radius:20px;font-size:11px;padding:3px 6px}.modal{position:fixed;inset:0;z-index:60;background:#0009;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:#09172a;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;background:#101f35;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.cart-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid #1e3550}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border-radius:9px;background:#1b3556;color:#fff}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:800;padding:15px 0}.empty{text-align:center;color:var(--muted);padding:35px 10px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#142945;border:1px solid #42648b;padding:11px 15px;border-radius:12px;z-index:100;display:none}.toast.show{display:block}.hidden{display:none!important}.notice{border:1px solid #6e4d14;background:#30240e;padding:12px;border-radius:14px;color:#ffe3a0}.scanner{background:#000;border-radius:16px;overflow:hidden;margin:10px 0}.scanner video{width:100%;display:block;max-height:280px;object-fit:cover}.small{font-size:12px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.products{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}.bottom{left:50%;right:auto;width:680px;transform:translateX(-50%);border-radius:20px 20px 0 0}.fab{right:calc(50% - 520px)}}
</style>
</head>
<body>
<div id="app" class="app">
<header class="top">
 <div class="brand"><img src="icon-192.svg" alt="Eithan"><div><h1>Mini Súper Eithan POS</h1><small>V11 · Caja e inventario</small></div></div>
 <div class="search"><input id="globalSearch" placeholder="Buscar producto o código..."><button onclick="openScanner()">📷</button></div>
</header>
<main id="page" class="page"></main>
<nav class="bottom">
 <button class="navbtn active" data-page="home" onclick="go('home')"><b>🏠</b>Inicio</button>
 <button class="navbtn" data-page="pos" onclick="go('pos')"><b>🧾</b>Caja</button>
 <button class="navbtn" data-page="inventory" onclick="go('inventory')"><b>📦</b>Inventario</button>
 <button class="navbtn" data-page="reports" onclick="go('reports')"><b>📊</b>Reportes</button>
 <button class="navbtn" data-page="more" onclick="go('more')"><b>☰</b>Más</button>
</nav>
<button class="fab" onclick="openCart()" title="Carrito">🛒<span id="cartCount" class="cart-count">0</span></button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
const KEY='eithan_pos_v11';
const seed=[
{id:1,name:'Arroz Diana 1 lb',barcode:'741100000001',cost:18,price:22,stock:24,min:5,img:'https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500'},
{id:2,name:'Maseca Extra Suave',barcode:'741100000002',cost:22,price:27,stock:18,min:5,img:'https://images.unsplash.com/photo-1603048297172-c92544798d5a?w=500'},
{id:3,name:'Leche Entera 1 L',barcode:'741100000003',cost:30,price:36,stock:10,min:4,img:'https://images.unsplash.com/photo-1563636619-e9143da7973b?w=500'},
{id:4,name:'Cloro 1 L',barcode:'741100000004',cost:20,price:26,stock:8,min:3,img:'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=500'},
{id:5,name:'Papas Lays',barcode:'741100000005',cost:18,price:25,stock:15,min:5,img:'https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=500'},
{id:6,name:'Nachos Diana',barcode:'741100000006',cost:12,price:18,stock:20,min:5,img:'https://images.unsplash.com/photo-1513456852971-30c0b8199d4d?w=500'},
{id:7,name:'Jabón Sur',barcode:'741100000007',cost:24,price:30,stock:7,min:3,img:'https://images.unsplash.com/photo-1607006344380-b6775a0824b7?w=500'},
{id:8,name:'Papel Higiénico',barcode:'741100000008',cost:16,price:22,stock:12,min:4,img:'https://images.unsplash.com/photo-1584556812952-905ffd0c611a?w=500'}
];
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{products:seed,sales:[],next:9};
let page='home',cart=[],search='';
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return 'L '+Number(n||0).toFixed(2)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function lowCount(){return db.products.filter(p=>p.stock<=p.min).length}
function todaySales(){const d=new Date().toISOString().slice(0,10);return db.sales.filter(s=>s.date===d)}
function salesTotal(){return todaySales().reduce((a,s)=>a+s.total,0)}
function profitTotal(){return todaySales().reduce((a,s)=>a+s.profit,0)}
function go(p){page=p;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render()}
document.getElementById('globalSearch').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase(); if(page!=='pos')page='pos'; render()});
function render(){const el=document.getElementById('page'); if(page==='home')el.innerHTML=home(); else if(page==='pos')el.innerHTML=pos(); else if(page==='inventory')el.innerHTML=inventory(); else if(page==='reports')el.innerHTML=reports(); else el.innerHTML=more(); updateCartCount()}
function home(){return `<div class="hero"><h2>¡Listo para vender! 🛒</h2><p>Tu caja, inventario y ganancias en un solo lugar.</p></div>
<div class="grid"><div class="card"><div class="label">Ventas hoy</div><div class="value">${money(salesTotal())}</div></div><div class="card"><div class="label">Ganancia hoy</div><div class="value green">${money(profitTotal())}</div></div><div class="card"><div class="label">Productos</div><div class="value yellow">${db.products.length}</div></div><div class="card"><div class="label">Stock bajo</div><div class="value red">${lowCount()}</div></div></div>
<div class="section-title"><h3>⚡ Acciones rápidas</h3></div><div class="actions"><button class="btn primary" onclick="go('pos')">🧾 Nueva venta</button><button class="btn" onclick="openProduct()">➕ Producto</button><button class="btn" onclick="openScanner()">📷 Escanear</button><button class="btn warn" onclick="go('inventory')">🔔 Stock bajo</button></div>
<div class="section-title"><h3>🔔 Alertas</h3></div>${lowCount()?`<div class="notice">Tienes <b>${lowCount()}</b> producto(s) con stock bajo. Revisa Inventario.</div>`:`<div class="card">✅ No tienes productos por debajo del stock mínimo.</div>`}`}

function filtered(){return db.products.filter(p=>!search||p.name.toLowerCase().includes(search)||p.barcode.includes(search))}
function productCards(arr){return `<div class="products">${arr.map(p=>`<div class="product"><img src="${esc(p.img||'icon-192.svg')}" onerror="this.src='icon-192.svg'"><div class="product-body"><div class="product-name">${esc(p.name)}</div><div class="product-meta">${esc(p.barcode)} · Stock ${p.stock}</div><div class="price">${money(p.price)}</div><div class="product-footer"><button class="btn primary" onclick="addCart(${p.id})">Agregar</button><button class="btn" onclick="openProduct(${p.id})">✏️</button></div></div></div>`).join('')}</div>`}
function pos(){const arr=filtered();return `<div class="section-title"><h3>🧾 Caja / POS</h3><button class="btn" onclick="openCart()">🛒 Carrito (${cart.length})</button></div>${search?`<div class="small" style="margin-bottom:10px">Resultados para: <b>${esc(search)}</b></div>`:''}${arr.length?productCards(arr):`<div class="empty">No encontré ese producto.<br><button class="btn primary" style="margin-top:10px" onclick="openProduct()">Crear producto</button></div>`}`}

function inventory(){const arr=search?filtered():db.products;return `<div class="section-title"><h3>📦 Inventario</h3><button class="btn primary" onclick="openProduct()">➕ Agregar</button></div>${arr.length?`<div class="list">${arr.map(p=>`<div class="row"><div class="row-main"><strong>${esc(p.name)}</strong><small>Costo ${money(p.cost)} · Venta ${money(p.price)} · Ganancia ${money(p.price-p.cost)} (${((p.price-p.cost)/p.cost*100||0).toFixed(1)}%)</small></div><span class="pill ${p.stock<=p.min?'low':''}">Stock ${p.stock}</span><button class="btn" onclick="openProduct(${p.id})">Editar</button></div>`).join('')}</div>`:`<div class="empty">No hay productos.</div>`}`}

function reports(){const sales=todaySales();const units=sales.reduce((a,s)=>a+s.items.reduce((q,i)=>q+i.qty,0),0);return `<div class="section-title"><h3>📊 Reportes</h3></div><div class="grid"><div class="card"><div class="label">Ventas hoy</div><div class="value">${sales.length}</div></div><div class="card"><div class="label">Unidades</div><div class="value">${units}</div></div><div class="card"><div class="label">Ingresos</div><div class="value">${money(salesTotal())}</div></div><div class="card"><div class="label">Ganancia</div><div class="value green">${money(profitTotal())}</div></div></div><div class="section-title"><h3>Últimas ventas</h3></div>${sales.length?`<div class="list">${sales.slice().reverse().slice(0,20).map(s=>`<div class="row"><div class="row-main"><strong>Venta #${s.id}</strong><small>${new Date(s.ts).toLocaleTimeString()} · ${s.items.length} productos</small></div><b>${money(s.total)}</b></div>`).join('')}</div>`:`<div class="empty">Todavía no hay ventas hoy.</div>`}`}

function more(){return `<div class="section-title"><h3>⚙️ Más</h3></div><div class="actions"><button class="btn" onclick="exportData()">⬇️ Exportar datos</button><button class="btn" onclick="importData()">⬆️ Importar datos</button><button class="btn danger" onclick="resetData()">♻️ Restaurar demo</button></div><div class="card" style="margin-top:12px"><b>Mini Súper Eithan POS V11</b><p class="small">Los datos se guardan en este dispositivo mediante almacenamiento local. Para usarla como app, agrégala a la pantalla de inicio desde Safari.</p></div>`}

function updateCartCount(){document.getElementById('cartCount').textContent=cart.reduce((a,i)=>a+i.qty,0)}
function addCart(id){const p=db.products.find(x=>x.id===id);if(!p||p.stock<=0)return showToast('Producto agotado');let x=cart.find(i=>i.id===id);if(x){if(x.qty>=p.stock)return showToast('No hay más stock');x.qty++}else cart.push({id,qty:1});updateCartCount();showToast('Agregado al carrito')}
function changeQty(id,d){const x=cart.find(i=>i.id===id),p=db.products.find(x=>x.id===id);if(!x)return;if(d>0&&x.qty>=p.stock)return showToast('Stock máximo alcanzado');x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);openCart()}
function openCart(){let total=cart.reduce((a,i)=>{const p=db.products.find(x=>x.id===i.id);return a+p.price*i.qty},0);document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h3>🛒 Factura / Carrito</h3><button class="btn" onclick="closeModal()">Cerrar</button></div>${cart.length?cart.map(i=>{const p=db.products.find(x=>x.id===i.id);return `<div class="cart-line"><div><b>${esc(p.name)}</b><div class="small">${money(p.price)} c/u · ${money(p.price*i.qty)}</div></div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><b>${i.qty}</b><button onclick="changeQty(${p.id},1)">+</button></div></div>`}).join('')+`<div class="total"><span>Total</span><span>${money(total)}</span></div><button class="btn success" style="width:100%;padding:15px" onclick="checkout()">💵 Cobrar ${money(total)}</button>`:`<div class="empty">Tu carrito está vacío.</div>`}`;openModal()}
function checkout(){if(!cart.length)return;const total=cart.reduce((a,i)=>{const p=db.products.find(x=>x.id===i.id);return a+p.price*i.qty},0);document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h3>💵 Cobrar</h3><button class="btn" onclick="openCart()">Atrás</button></div><div class="card"><div class="label">Total a cobrar</div><div class="value">${money(total)}</div></div><div class="field"><label>Efectivo recibido</label><input id="cash" type="number" inputmode="decimal" value="${total}" oninput="calcChange(${total})"></div><div id="change" class="card">Cambio: <b>${money(0)}</b></div><button class="btn success" style="width:100%;padding:15px;margin-top:10px" onclick="finishSale()">✅ Confirmar venta</button>`}
function calcChange(t){const c=Number(document.getElementById('cash').value||0);document.getElementById('change').innerHTML=`Cambio: <b class="${c>=t?'green':'red'}">${money(Math.max(0,c-t))}</b>`}
function finishSale(){const total=cart.reduce((a,i)=>a+db.products.find(p=>p.id===i.id).price*i.qty,0);const cash=Number(document.getElementById('cash').value||0);if(cash<total)return showToast('El efectivo no alcanza');let profit=0;const items=cart.map(i=>{const p=db.products.find(p=>p.id===i.id);p.stock-=i.qty;profit+=(p.price-p.cost)*i.qty;return{id:p.id,name:p.name,qty:i.qty,price:p.price,cost:p.cost}});const sale={id:db.sales.length+1,date:new Date().toISOString().slice(0,10),ts:Date.now(),total,cash,change:cash-total,profit,items};db.sales.push(sale);save();cart=[];closeModal();render();showToast('Venta registrada ✅');if(lowCount())setTimeout(()=>showToast('🔔 Hay productos con stock bajo'),500)}
function openProduct(id){const p=id?db.products.find(x=>x.id===id):{name:'',barcode:'',cost:0,price:0,stock:0,min:3,img:''};document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h3>${id?'✏️ Editar':'➕ Nuevo'} producto</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="field"><label>Nombre</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>Código de barras</label><input id="pb" inputmode="numeric" value="${esc(p.barcode)}"></div><div class="two"><div class="field"><label>Costo (L)</label><input id="pc" type="number" step="0.01" value="${p.cost}"></div><div class="field"><label>Precio venta (L)</label><input id="pp" type="number" step="0.01" value="${p.price}"></div></div><div class="two"><div class="field"><label>Stock</label><input id="ps" type="number" value="${p.stock}"></div><div class="field"><label>Stock mínimo</label><input id="pm" type="number" value="${p.min}"></div></div><div class="field"><label>URL de imagen (opcional)</label><input id="pi" value="${esc(p.img||'')}"></div><button class="btn success" style="width:100%;padding:14px" onclick="saveProduct(${id||0})">💾 Guardar producto</button>${id?`<button class="btn danger" style="width:100%;padding:12px;margin-top:8px" onclick="deleteProduct(${id})">Eliminar</button>`:''}`;openModal()}
function saveProduct(id){const name=document.getElementById('pn').value.trim(),barcode=document.getElementById('pb').value.trim();if(!name)return showToast('Escribe el nombre');let p=id?db.products.find(x=>x.id===id):{id:db.next++};Object.assign(p,{name,barcode,cost:Number(document.getElementById('pc').value||0),price:Number(document.getElementById('pp').value||0),stock:Number(document.getElementById('ps').value||0),min:Number(document.getElementById('pm').value||0),img:document.getElementById('pi').value.trim()});if(!id)db.products.push(p);save();closeModal();render();showToast('Producto guardado')}
function deleteProduct(id){if(confirm('¿Eliminar este producto?')){db.products=db.products.filter(p=>p.id!==id);save();closeModal();render()}}
function openScanner(){document.getElementById('sheet').innerHTML=`<div class="sheet-head"><h3>📷 Escanear código</h3><button class="btn" onclick="closeModal()">Cerrar</button></div><div class="scanner"><video id="video" playsinline></video></div><p class="small">Apunta la cámara al código de barras. Si tu navegador no permite escaneo automático, escribe el código abajo.</p><div class="field"><input id="manualBarcode" inputmode="numeric" placeholder="Código de barras"></div><button class="btn primary" style="width:100%" onclick="useBarcode()">Buscar código</button>`;openModal();startScanner()}
let stream=null,scanTimer=null;
async function startScanner(){try{if(!('BarcodeDetector'in window)){return}stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=document.getElementById('video');v.srcObject=stream;await v.play();const detector=new BarcodeDetector();scanTimer=setInterval(async()=>{try{const codes=await detector.detect(v);if(codes.length){const code=codes[0].rawValue;stopScanner();closeModal();search=code;document.getElementById('globalSearch').value=code;go('pos');const p=db.products.find(x=>x.barcode===code);if(p)addCart(p.id);else showToast('Código no encontrado')}}catch(e){}},500)}catch(e){showToast('No se pudo abrir la cámara')}}
function useBarcode(){const c=document.getElementById('manualBarcode').value.trim();if(!c)return;stopScanner();closeModal();search=c;document.getElementById('globalSearch').value=c;go('pos');const p=db.products.find(x=>x.barcode===c);if(p)addCart(p.id);else showToast('Código no encontrado')}
function stopScanner(){if(scanTimer)clearInterval(scanTimer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){stopScanner();document.getElementById('modal').classList.remove('open')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Mini_Super_Eithan_POS_datos.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render();showToast('Datos importados')}catch(e){showToast('Archivo inválido')}};r.readAsText(f)};i.click()}
function resetData(){if(confirm('Esto reemplazará los datos por la demostración. ¿Continuar?')){db={products:seed,sales:[],next:9};save();cart=[];render();showToast('Demo restaurada')}}
render();
</script>
</body>
</html>
