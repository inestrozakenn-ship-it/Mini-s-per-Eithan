<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071124"><link rel="manifest" href="manifest.webmanifest"><title>Mini Súper Eithan POS V11</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#071124;color:white}header{padding:18px 15px;background:#09152a;position:sticky;top:0}header img{width:55px;height:55px;border-radius:14px;vertical-align:middle;margin-right:10px}h1{display:inline;font-size:21px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;padding:14px;border-radius:14px;border:1px solid #304563;background:#111f35;color:white;font-size:16px}.search button{border:0;border-radius:14px;background:#1769e0;color:white;padding:0 17px;font-size:21px}main{padding:15px 14px 90px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.product{background:#101e34;border:1px solid #2b405e;border-radius:18px;padding:15px}.label{color:#9aabc2}.value{font-size:25px;font-weight:700;margin-top:5px}.green{color:#25d66c}.yellow{color:#ffc329}.red{color:#ff6873}h2{margin-top:24px}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product img{width:100%;border-radius:12px}.product b{display:block;margin-top:8px}.price{color:#6da9ff;font-weight:700;font-size:18px;margin:5px 0}.product button{width:100%;padding:11px;border:0;border-radius:11px;background:#1769e0;color:white;font-weight:700}.cart{position:fixed;right:18px;bottom:78px;border:0;border-radius:50%;width:58px;height:58px;background:#ff9d00;font-size:24px}nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#0b172b;display:flex;justify-content:space-around;padding-top:10px}nav button{background:none;border:0;color:#b2bfd1;font-size:11px}nav span{display:block;font-size:20px}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end}.sheet{background:#0e1b30;width:100%;padding:20px;border-radius:24px 24px 0 0}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #29405d}.pay{width:100%;padding:14px;margin-top:14px;border:0;border-radius:13px;background:#20b85a;color:white;font-weight:800}</style></head><body><header><img src="icon-192.png"><h1>Mini Súper Eithan POS V11</h1><div class="search"><input id="q" placeholder="Buscar producto o código"><button onclick="scan()">▣</button></div></header><main><div class="stats"><div class="card"><div class="label">Ventas hoy</div><div class="value" id="sales">L 0.00</div></div><div class="card"><div class="label">Ganancia hoy</div><div class="value green" id="profit">L 0.00</div></div><div class="card"><div class="label">Productos</div><div class="value yellow" id="count">8</div></div><div class="card"><div class="label">Stock bajo</div><div class="value red" id="low">0</div></div></div><h2>🧾 Caja</h2><div class="products" id="products"></div></main><button class="cart" onclick="openCart()">🛒</button><nav><button onclick="location.reload()"><span>🏠</span>Inicio</button><button onclick="openCart()"><span>🧾</span>Caja</button><button><span>📦</span>Inventario</button><button><span>🚚</span>Compras</button><button><span>📊</span>Reportes</button></nav><div class="modal" id="modal"><div class="sheet"><h2>Factura</h2><div id="items"></div><div class="row"><b>Total</b><b id="total">L 0.00</b></div><button class="pay" onclick="checkout()">Cobrar venta</button></div></div><script>const P=[["Arroz",38,30,20],["Leche",32,25,15],["Lays Clásicas",25,18,12],["Clorox",42,33,10],["Nachos Diana",18,13,18],["Aceite",58,48,8],["Papel higiénico",22,16,9],["Frijoles",42,34,14]];let cart=[],sales=0,profit=0;const M=n=>"L "+n.toFixed(2);function render(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("products").innerHTML=P.map((p,i)=>({p,i})).filter(x=>x.p[0].toLowerCase().includes(q)).map(x=>`<div class="product"><img src="icon-192.png"><b>${x.p[0]}</b><span>Stock: ${x.p[3]}</span><div class="price">${M(x.p[1])}</div><small>Ganancia: ${M(x.p[1]-x.p[2])} · ${((x.p[1]-x.p[2])/x.p[2]*100).toFixed(0)}%</small><button onclick="add(${x.i})">Agregar</button></div>`).join("");document.getElementById("sales").textContent=M(sales);document.getElementById("profit").textContent=M(profit);document.getElementById("low").textContent=P.filter(p=>p[3]<=5).length}function add(i){let x=cart.find(x=>x.i===i);if(x)x.q++;else cart.push({i,q:1});render()}function openCart(){document.getElementById("modal").style.display="flex";let t=0;document.getElementById("items").innerHTML=cart.map(x=>{let p=P[x.i],v=p[1]*x.q;t+=v;return `<div class="row"><span>${p[0]} × ${x.q}</span><b>${M(v)}</b></div>`}).join("")||"<p>Carrito vacío</p>";document.getElementById("total").textContent=M(t)}function checkout(){let t=0,g=0;cart.forEach(x=>{let p=P[x.i];p[3]-=x.q;t+=p[1]*x.q;g+=(p[1]-p[2])*x.q});sales+=t;profit+=g;cart=[];document.getElementById("modal").style.display="none";render();alert("Venta registrada")}function scan(){let c=prompt("Escribe el código de barras");if(c){document.getElementById("q").value=c;render()}}document.getElementById("q").oninput=render;render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script></body></html>
